<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Punto Moda - Canguro Oversize</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="shortcut icon" type="image/png" href="imagenes/favicon.png">
</head>
<body>

	<!--
		Archivo: detalle-producto.html
		Proyecto: PuntoModa - ByteNova
		Ultima actualizacion: 04/09/2026
	-->

	<!-- Encabezado y navegacion principal -->
	<header>
		<nav class="barra-navegacion">
			<a href="index.html" class="logo">Punto<span>Moda</span></a>
			<ul class="enlaces-navegacion">
				<li><a href="index.html">Inicio</a></li>
				<li><a href="productos.html" class="activo">Productos</a></li>
				<li><a href="carrito.html">Carrito <span id="contador-carrito" class="contador-carrito">0</span></a></li>
				<li><a href="login.html">Ingresar</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<!-- Detalle del producto seleccionado -->
		<section class="detalle-producto">
			<div class="detalle-imagen">
				<img src="imagenes/canguro.jpg" alt="Canguro Oversize">
			</div>

			<div class="detalle-info">
				<p class="categoria-producto">Abrigos</p>
				<h1>Canguro Oversize</h1>
				<p class="detalle-precio">$ 1.890</p>
				<p class="detalle-descripcion">Canguro de estilo oversize perteneciente al catálogo de Punto Moda.</p>

				<div class="seleccion-talle detalle-talle">
					<label for="talle-detalle">Talle</label>
					<select id="talle-detalle" class="selector-talle" data-producto-id="1">
						<option value="S">S</option>
						<option value="M">M</option>
						<option value="L">L</option>
						<option value="XL">XL</option>
					</select>
				</div>

				<div class="detalle-acciones">
					<button type="button" class="btn btn-agregar-producto" data-id="1">Agregar al Carrito</button>
					<a href="productos.html" class="btn btn-secundario">Volver al catálogo</a>
				</div>
			</div>
		</section>
	</main>

	<!-- Mensaje que JavaScript muestra al agregar el producto -->
	<div id="mensaje-flotante" class="mensaje-flotante"></div>

	<footer>
		<p>&copy; Diseñado por ByteNova 2026</p>
	</footer>

	<!-- storage.js se carga primero porque catalogo.js usa sus funciones -->
	<script src="js/storage.js"></script>
	<script src="js/catalogo.js"></script>
</body>
</html>
