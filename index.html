<!DOCTYPE html>

	<link rel="stylesheet" href="css/style.css">
	<link rel="shortcut icon" type="image/png" href="imagenes/favicon.png">

<body>

	<!--
		Archivo: index.html

	<!-- Encabezado y navegacion principal -->
	<header>
		<nav class="barra-navegacion">
			<a href="index.html" class="logo">Punto<span>Moda</span></a>
			<ul class="enlaces-navegacion">
				<li><a href="index.html" class="activo">Inicio</a></li>
				<li><a href="productos.html">Productos</a></li>

				<li><a href="login.html">Ingresar</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<!-- Presentacion principal del sitio -->
		<section class="presentacion">
			<h1>Bienvenidos a Punto Moda</h1>
			<p>La revolución del e-commerce de indumentaria. Diseños exclusivos y calidad garantizada.</p>
			<a href="productos.html" class="btn">Ver Catálogo</a>

		<!-- Producto destacado -->
		<section>
			<h2 class="titulo-seccion">Producto Destacado</h2>
			<div class="cuadricula-productos">

							<img src="imagenes/canguro.jpg" alt="Canguro Oversize">

					<div class="info-producto">

						<div class="botones-producto">
							<a href="detalle-producto.html" class="btn btn-secundario">Ver detalle</a>
							<button type="button" class="btn btn-agregar-producto" data-id="1">Agregar al Carrito</button>
						</div>
					</div>
				</div>
			</div>
		</section>
	</main>

	<!-- Mensaje que JavaScript muestra al agregar un producto -->
	<div id="mensaje-flotante" class="mensaje-flotante"></div>

	<footer>
		<p>&copy; Diseñado por ByteNova 2026</p>
