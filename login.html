<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Punto Moda - Login</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="shortcut icon" type="image/png" href="imagenes/favicon.png">
</head>
<body>

	<!--
		Archivo: login.html
		Proyecto: PuntoModa - ByteNova
		Ultima actualizacion: 04/09/2026
	-->

	<!-- Encabezado y navegacion principal -->
	<header>
		<nav class="barra-navegacion">
			<a href="index.html" class="logo">Punto<span>Moda</span></a>
			<ul class="enlaces-navegacion">
				<li><a href="index.html">Inicio</a></li>
				<li><a href="productos.html">Productos</a></li>
				<li><a href="carrito.html">Carrito <span id="contador-carrito" class="contador-carrito">0</span></a></li>
				<li><a href="login.html" class="activo">Ingresar</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<!-- Formulario de inicio de sesion. La conexion con PHP se agregara mas adelante. -->
		<div class="contenedor-autenticacion">
			<div class="pestanas-autenticacion">
				<a href="login.html" class="pestana-autenticacion activo">Iniciar Sesión</a>
				<a href="registro.html" class="pestana-autenticacion">Registrarse</a>
			</div>

			<form id="form-login" action="#">
				<div class="grupo-formulario">
					<label for="login-email">Correo Electrónico</label>
					<input type="email" id="login-email" placeholder="ejemplo@correo.com" required>
				</div>
				<div class="grupo-formulario">
					<label for="login-password">Contraseña</label>
					<input type="password" id="login-password" placeholder="********" required>
				</div>
				<button type="submit" class="btn">Ingresar</button>
				<p id="mensaje-login" class="mensaje-formulario"></p>
				<div class="pie-autenticacion">
					<p>¿No tenés cuenta? <a href="registro.html">Registrate acá</a></p>
				</div>
			</form>
		</div>
	</main>

	<footer>
		<p>&copy; Diseñado por ByteNova 2026</p>
	</footer>

	<script src="js/storage.js"></script>
	<script src="js/login.js"></script>
</body>
</html>
