<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Punto Moda - Registro</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="shortcut icon" type="image/png" href="imagenes/favicon.png">
</head>
<body>

	<!--
		Archivo: registro.html
		Proyecto: PuntoModa - ByteNova
		Ultima actualizacion: 04/09/2026
	-->

	<!-- Encabezado y navegacion principal -->
	<header>
		<nav class="barra-navegacion">
			<a href="index.html" class="logo">Punto<span>Moda</span></a>
			<ul class="enlaces-navegacion">
				<li><a href="index.html">Inicio</a></li>
				<li><a href="productos.html">Productos</a></li>
				<li><a href="carrito.html">Carrito <span id="contador-carrito" class="contador-carrito">0</span></a></li>
				<li><a href="login.html" class="activo">Ingresar</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<!-- Formulario de registro. Por ahora no esta conectado con PHP. -->
		<div class="contenedor-autenticacion">
			<div class="pestanas-autenticacion">
				<a href="login.html" class="pestana-autenticacion">Iniciar Sesión</a>
				<a href="registro.html" class="pestana-autenticacion activo">Registrarse</a>
			</div>

			<form id="form-registro" action="#">
				<div class="grupo-formulario">
					<label for="registro-nombre">Nombre completo</label>
					<input type="text" id="registro-nombre" placeholder="Nombre y apellido" required>
				</div>

				<div class="grupo-formulario">
					<label for="registro-email">Correo Electrónico</label>
					<input type="email" id="registro-email" placeholder="ejemplo@correo.com" required>
				</div>

				<div class="grupo-formulario">
					<label for="registro-password">Contraseña</label>
					<input type="password" id="registro-password" placeholder="********" required>
				</div>

				<div class="grupo-formulario">
					<label for="registro-confirmar">Confirmar contraseña</label>
					<input type="password" id="registro-confirmar" placeholder="********" required>
				</div>

				<button type="submit" class="btn">Crear cuenta</button>
				<p id="mensaje-registro" class="mensaje-formulario"></p>
				<div class="pie-autenticacion">
					<p>¿Ya tenés cuenta? <a href="login.html">Iniciá sesión acá</a></p>
				</div>
			</form>
		</div>
	</main>

	<footer>
		<p>&copy; Diseñado por ByteNova 2026</p>
	</footer>

	<script src="js/storage.js"></script>
	<script src="js/registro.js"></script>
</body>
</html>
